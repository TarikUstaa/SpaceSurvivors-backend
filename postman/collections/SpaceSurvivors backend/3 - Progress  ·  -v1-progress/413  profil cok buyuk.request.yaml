$kind: http-request
description: |-
  64 KB siniri. Gercek bir profil birkac yuz bayt.

  Boyut kontrolu surum kontrolunden ONCE calisiyor, o yuzden surum dogru olsa da 413 doner.
url: "{{baseUrl}}/v1/progress"
method: PUT
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "progress": { "junk": "{{bigBlob}}" },
      "version": 1
    }
scripts:
  - type: beforeRequest
    code: |-
      // 70 KB dolgu, burada uretiliyor ki koleksiyon dosyasi kucuk kalsin.
      pm.variables.set('bigBlob', 'x'.repeat(70000));
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 413', () => pm.response.to.have.status(413));
    language: text/javascript
order: 6000
