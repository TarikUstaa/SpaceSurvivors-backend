$kind: http-request
name: 409  eski surum -> catisma
description: |-
  Yanlis bir surum yolluyoruz. Optimistic locking devrede: UPDATE ... WHERE version = 5 hicbir satira uymuyor.

  Sunucu koru korune ezmek yerine kendi kopyasini geri veriyor. wallet:999 YAZILMADI. Bu olmasaydi: telefonda kazandigin scrap, tablette eski profil kaydedilince ucardi.
url: "{{baseUrl}}/v1/progress"
method: PUT
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "progress": {
        "wallet": 999
      },
      "version": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 409', () => pm.response.to.have.status(409));
      pm.test('sunucunun surumu bildiriliyor', () => pm.expect(pm.response.json().serverVersion).to.eql(0));
      pm.test('sunucunun kopyasi geri veriliyor', () => pm.expect(pm.response.json().progress.wallet).to.eql(100));
    language: text/javascript
order: 4000
