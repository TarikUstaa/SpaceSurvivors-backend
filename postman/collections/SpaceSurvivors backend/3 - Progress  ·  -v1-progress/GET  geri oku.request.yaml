$kind: http-request
description: "Dikkat: cevapta userId var ama sen gondermedin. Sunucu kendi player_id'sini basiyor. Body'ye \"userId\":\"hacker\" yazip yollasan bile uzerine yazar."
url: "{{baseUrl}}/v1/progress"
method: GET
headers:
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('kaydettigimiz veri geldi', () => pm.expect(pm.response.json().progress.wallet).to.eql(100));
      pm.test('userId sunucu tarafindan basilmis', () => pm.expect(pm.response.json().progress.userId).to.match(/^[0-9a-f-]{36}$/));
    language: text/javascript
order: 3000
