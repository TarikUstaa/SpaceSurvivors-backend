$kind: http-request
description: "Profil var ama ilerleme kaydi yok. 404, 'bos profil'den farkli bir sey soyluyor: istemci bunu gorunce kendi local kaydini yukluyor."
url: "{{baseUrl}}/v1/progress"
method: GET
headers:
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: pm.test('status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 1000
