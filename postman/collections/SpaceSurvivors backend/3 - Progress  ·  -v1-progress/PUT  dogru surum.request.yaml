$kind: http-request
description: Artik elindeki surum dogru. Yazildi, surum 1 oldu.
url: "{{baseUrl}}/v1/progress"
method: PUT
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "progress": {
        "schemaVersion": 5,
        "wallet": 250
      },
      "version": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('surum ilerledi', () => pm.expect(pm.response.json().version).to.eql(1));
    language: text/javascript
order: 5000
