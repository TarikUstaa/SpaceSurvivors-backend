$kind: http-request
description: |-
  version:0 = 'elimde sunucudan gelmis bir surum yok, bu ilk yuklemem'.

  Donen surum 0, cunku Hibernate'in @Version'i sifirdan basliyor. Sayi istemci icin anlamsiz — sadece geri yollamasi gereken bir jeton.
url: "{{baseUrl}}/v1/progress"
method: PUT
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "progress": {
        "schemaVersion": 5,
        "wallet": 100,
        "ownedShipIds": [
          "scout"
        ]
      },
      "version": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('surum 0', () => pm.expect(pm.response.json().version).to.eql(0));
    language: text/javascript
order: 2000
