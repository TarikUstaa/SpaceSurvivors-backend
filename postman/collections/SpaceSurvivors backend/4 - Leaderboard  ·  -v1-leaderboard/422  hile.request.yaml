$kind: http-request
description: |-
  400 ile 422 farki: JSON kusursuz, her alan dogru tipte ve pozitif. Sunucu istegi ANLADI. Sadece '10 saniyede 50.000 kill bu oyunda olmaz' diyor.

  400 = anlayamadim. 422 = anladim ama olmaz.
url: "{{baseUrl}}/v1/leaderboard"
method: POST
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mode": "infinite",
      "survivedSeconds": 10,
      "kills": 50000,
      "reachedLevel": 1,
      "bossesDefeated": 0
    }
scripts:
  - type: afterResponse
    code: pm.test('status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 6000
