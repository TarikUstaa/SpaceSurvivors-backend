$kind: http-request
description: Run bitiminde oyun bunu gonderiyor.
url: "{{baseUrl}}/v1/leaderboard"
method: POST
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mode": "infinite",
      "survivedSeconds": 300,
      "kills": 420,
      "reachedLevel": 18,
      "bossesDefeated": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('yeni rekor', () => pm.expect(pm.response.json().isNewRecord).to.be.true);
      pm.test('en iyi 300', () => pm.expect(pm.response.json().personalBest).to.eql(300));
    language: text/javascript
order: 1000
