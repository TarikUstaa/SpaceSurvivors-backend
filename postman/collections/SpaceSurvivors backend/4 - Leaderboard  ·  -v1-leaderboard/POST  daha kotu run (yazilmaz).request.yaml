$kind: http-request
description: 200 donuyor ama HICBIR SEY YAZILMIYOR. 200 'istegini isledim' demek, 'veriyi degistirdim' demek degil. Gercek cevap isNewRecord:false.
url: "{{baseUrl}}/v1/leaderboard"
method: POST
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mode": "infinite",
      "survivedSeconds": 250,
      "kills": 300,
      "reachedLevel": 15,
      "bossesDefeated": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('rekor degil', () => pm.expect(pm.response.json().isNewRecord).to.be.false);
      pm.test('en iyi hala 300', () => pm.expect(pm.response.json().personalBest).to.eql(300));
    language: text/javascript
order: 3000
