$kind: http-request
description: Alan bicimi hatasi. Anotasyonlar yakaliyor, kod servise hic girmiyor.
url: "{{baseUrl}}/v1/leaderboard"
method: POST
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mode": "infinite",
      "survivedSeconds": 100,
      "kills": -5,
      "reachedLevel": 0,
      "bossesDefeated": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 400', () => pm.response.to.have.status(400));
      pm.test('iki alan da bildiriliyor', () => {
          pm.expect(pm.response.json().fields).to.have.property('kills');
          pm.expect(pm.response.json().fields).to.have.property('reachedLevel');
      });
    language: text/javascript
order: 5000
