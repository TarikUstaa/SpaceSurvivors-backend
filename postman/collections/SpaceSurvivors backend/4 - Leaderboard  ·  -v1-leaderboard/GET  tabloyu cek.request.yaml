$kind: http-request
description: Filtre URL'de, cunku GET'in govdesi olmaz. Listede player_id YOK — sadece displayName; kimlikler disari sizmiyor.
url: "{{baseUrl}}/v1/leaderboard?mode=infinite&limit=10"
method: GET
headers:
  Authorization: Bearer {{tokenA}}
queryParams:
  mode: infinite
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('sureye gore azalan sirali', () => {
          const s = pm.response.json().entries.map(e => e.survivedSeconds);
          pm.expect(s).to.eql([...s].sort((a, b) => b - a));
      });
      pm.test('sira numaralari 1den basliyor', () => pm.expect(pm.response.json().entries[0].rank).to.eql(1));
      pm.test('kendi durumum var', () => pm.expect(pm.response.json().me.survivedSeconds).to.eql(300));
      pm.test('kimlik sizmiyor', () => pm.expect(pm.response.json().entries[0]).to.not.have.property('playerId'));
    language: text/javascript
order: 4000
