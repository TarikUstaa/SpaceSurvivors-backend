$kind: http-request
url: "{{baseUrl}}/v1/leaderboard"
method: POST
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "mode": "sandbox",
      "survivedSeconds": 10,
      "kills": 1,
      "reachedLevel": 1,
      "bossesDefeated": 0
    }
scripts:
  - type: afterResponse
    code: pm.test('status 422', () => pm.response.to.have.status(422));
    language: text/javascript
order: 7000
