$kind: collection
description: |-
  Kaynak basina klasorler. **Run collection** ile hepsini bir kerede calistir — her istegin dogrulama script'i var, sonunda gecen/kalan raporu cikar.

  **Sira onemli:** Health degiskenleri uretiyor, Auth token'lari dolduruyor, Progress kendi icinde 404 -> kayit -> catisma sirasini izliyor.

  Her calistirmada benzersiz cihaz kimligi, sir ve isim uretiliyor, o yuzden art arda calistirilabilir.

  Kimlik: cihaz sirri sadece POST /v1/auth/token'a gidiyor, karsiliginda 1 saatlik token aliniyor, diger her istek `Authorization: Bearer` tasiyor. Iki oyuncu: {{tokenA}}, {{tokenB}}.

  Sunucu: IntelliJ'de SpacesurvivorsApplication -> Run.
variables:
  baseUrl: http://localhost:8080
  runId: ""
  deviceA: ""
  deviceB: ""
  secretA: ""
  secretB: ""
  tokenA: ""
  tokenB: ""
  name1: ""
  firstName: ""
  forgedToken: ""
