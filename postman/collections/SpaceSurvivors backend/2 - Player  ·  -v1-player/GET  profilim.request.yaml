$kind: http-request
description: Kayit girista olustugu icin profil hazir. Uretilen ad `User` + 6 hane.
url: "{{baseUrl}}/v1/player"
method: GET
headers:
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('uretilmis ad bicimi', () => pm.expect(pm.response.json().displayName).to.match(/^User\d{6}$/));
      pm.test('kimlik sizmiyor', () => {
          pm.expect(pm.response.json()).to.not.have.property('playerId');
          pm.expect(pm.response.json()).to.not.have.property('deviceId');
      });
      pm.collectionVariables.set('firstName', pm.response.json().displayName);
    language: text/javascript
order: 1000
