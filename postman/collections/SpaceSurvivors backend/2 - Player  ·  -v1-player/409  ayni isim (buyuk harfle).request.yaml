$kind: http-request
description: "Isimler BUYUK/KUCUK HARF DUYARSIZ benzersiz: lower(display_name) uzerinde unique index var. Duz UNIQUE olsaydi 'tarik' ve 'TARIK' yan yana var olurdu ve birini taklit etmek cok kolay olurdu."
url: "{{baseUrl}}/v1/player"
method: PATCH
headers:
  Authorization: Bearer {{tokenB}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "displayName": "{{name1}}"
    }
scripts:
  - type: afterResponse
    code: pm.test('status 409', () => pm.response.to.have.status(409));
    language: text/javascript
order: 5000
