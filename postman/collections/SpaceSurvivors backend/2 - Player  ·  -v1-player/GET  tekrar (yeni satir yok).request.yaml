$kind: http-request
description: "Ayni ad donmeli: her istekte yeni oyuncu yaratilmadiginin kaniti."
url: "{{baseUrl}}/v1/player"
method: GET
headers:
  Authorization: Bearer {{tokenA}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('ayni oyuncu', () => pm.expect(pm.response.json().displayName).to.eql(pm.collectionVariables.get('firstName')));
    language: text/javascript
order: 2000
