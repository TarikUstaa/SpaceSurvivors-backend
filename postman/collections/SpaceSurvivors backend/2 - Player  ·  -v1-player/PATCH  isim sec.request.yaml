$kind: http-request
description: Oyun ici profil ekrani bunu cagiracak. player_id degismiyor, sadece ad.
url: "{{baseUrl}}/v1/player"
method: PATCH
headers:
  Authorization: Bearer {{tokenA}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "displayName": "{{name1}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status 200', () => pm.response.to.have.status(200));
      pm.test('yeni ad donuyor', () => pm.expect(pm.response.json().displayName).to.eql(pm.collectionVariables.get('name1')));
      pm.test('uretilmis ad degisti', () => pm.expect(pm.response.json().displayName).to.not.eql(pm.collectionVariables.get('firstName')));
    language: text/javascript
order: 3000
