$kind: http-request
description: Imzasi bozulmus token. Sunucu imzayi dogruladigi icin fark ediyor.
url: "{{baseUrl}}/v1/player"
method: GET
headers:
  Authorization: Bearer {{forgedToken}}
scripts:
  - type: beforeRequest
    code: |-
      // Gecerli bir token'in imzasinin son karakterini degistir. Icerigi hala
      // kusursuz — eski Device header'inin ASLA yakalayamayacagi sey buydu.
      const t = pm.collectionVariables.get('tokenA');
      pm.collectionVariables.set('forgedToken', t.slice(0, -1) + (t.slice(-1) === 'A' ? 'B' : 'A'));
    language: text/javascript
  - type: afterResponse
    code: pm.test('status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 7000
