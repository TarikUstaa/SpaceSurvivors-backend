# Runs the test suite on every push and every pull request.
#
# This is worth having now, and was not before: until D22 the tests needed a Postgres
# somebody had installed and a git-ignored password file, so they could only ever run on
# one laptop. Now they bring their own database in a container, and a GitHub runner has a
# Docker daemon already running, so the same `./mvnw test` that passes locally passes here
# with nothing added.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels a run still in progress — the older result is
# about to be stale anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Temurin 25 to match <java.version> in the pom. `cache: maven` keeps ~/.m2 between
      # runs so a build is not spent re-downloading Spring Boot every time.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # --batch-mode drops the interactive prompts; --no-transfer-progress drops the
      # per-artifact download spinner, which is thousands of useless lines in a CI log.
      # A failing test prints its own assertion and stack trace here, which for a suite
      # this size is enough to see what broke without a reporting plugin.
      - name: Run tests
        run: ./mvnw --batch-mode --no-transfer-progress test
