# Builds the image and rolls it out, but only from main and only after the tests pass.
#
# It is a separate workflow from ci.yml rather than another job in it because the two answer
# different questions. CI answers "is this commit sound?" and must run on every branch and
# every pull request. This answers "should this commit be serving players?" — which is only
# ever true of main. Keeping them apart means a pull request cannot deploy, and the deploy
# path stays readable instead of being a pile of `if` conditions on someone else's job.
#
# The gate is `workflow_run`: this starts only when CI has finished, and the first step
# checks CI actually succeeded. GitHub will start a workflow_run listener even for a failed
# run, so that check is not decoration.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # Also allow a deploy by hand — for rolling back to an older commit, or re-running one
  # that failed at the Azure step rather than the build.
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false   # never interrupt a rollout half-applied

jobs:
  deploy:
    # A failed or cancelled CI run must not deploy. workflow_dispatch has no parent run, so
    # the second half of this lets a manual deploy through.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write     # to push the image to ghcr.io
      id-token: write     # to get an OIDC token Azure will trust

    steps:
      # For a workflow_run the default checkout is the workflow file's branch, not the
      # commit that triggered it — pin it explicitly so a deploy always ships the code CI
      # actually tested.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # github.repository_owner keeps the account's capitalisation — "TarikUstaa" — and a
      # container registry rejects that outright: "repository name must be lowercase". Fold it
      # once here, together with the sha, so the three places that name the image cannot drift
      # apart or repeat the workflow_run fallback expression.
      - name: Work out the image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/spacesurvivors-backend" >> "$GITHUB_ENV"
          echo "SHA=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_ENV"

      # Required before the build: the runner's default docker driver cannot write a cache to
      # anywhere but the local layer store, so `cache-to: type=gha` fails immediately with
      # "buildx failed" and a link to the cache-backends page. This swaps in the
      # docker-container driver, which supports remote cache backends.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on purpose: the commit sha is what makes a rollback possible ("run the
      # image from the commit before the bad one"), and :latest is what the container app is
      # configured to pull.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # OIDC: GitHub proves this workflow's identity to Azure directly and Azure hands back a
      # short-lived token. There is no client secret in the repository to leak or rotate —
      # which is the whole point, given that a stolen one would be a key to the subscription.
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out the new image
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --resource-group "${{ secrets.AZURE_RG }}" \
            --name "${{ secrets.AZURE_APP }}" \
            --image "${{ env.IMAGE }}:${{ env.SHA }}"

      # A deploy that reports success while the container is crash-looping is worse than one
      # that fails, so confirm the thing is actually answering before calling it done.
      # Container Apps shifts traffic to the new revision gradually, and the app scales from
      # zero, so the first few attempts legitimately fail.
      - name: Verify it is serving
        run: |
          FQDN=$(az containerapp show \
            --resource-group "${{ secrets.AZURE_RG }}" \
            --name "${{ secrets.AZURE_APP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)

          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 10 "https://$FQDN/health" 2>/dev/null) || { sleep 10; continue; }
            echo "attempt $i: $body"
            case "$body" in
              *'"status":"UP"'*'"db":"UP"'*) echo "healthy"; exit 0 ;;
            esac
            sleep 10
          done

          echo "::error::still not healthy after 5 minutes"
          exit 1
