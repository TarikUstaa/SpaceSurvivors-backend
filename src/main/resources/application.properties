spring.application.name=spacesurvivors

# ── profile ───────────────────────────────────────────────────────────────
# Defaults to "local", which pulls in the git-ignored application-local.properties
# holding this machine's database password. Deployments set SPRING_PROFILES_ACTIVE
# and supply DB_* through the environment instead.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── database ──────────────────────────────────────────────────────────────
# Spring opens a small connection pool (HikariCP) to this URL on startup and hands
# it to JdbcClient / Flyway. No credential is committed: the password has no
# default here, so a missing one fails loudly at startup rather than silently
# falling back to something a repository once knew.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spacesurvivors}
spring.datasource.username=${DB_USER:ss_app}
spring.datasource.password=${DB_PASSWORD}

# ── jpa / hibernate ────────────────────────────────────────────────────────
# validate, not update: Flyway owns the schema. Hibernate only checks that the
# entities match what the migrations built, and refuses to start if they drift —
# a mismatch found at boot beats one found by a user.
spring.jpa.hibernate.ddl-auto=validate

# Off. Open-in-view keeps a database session alive for the whole request so a lazy
# association can still be loaded while the response is being rendered. That hides
# where queries actually happen and holds a connection far longer than needed.
spring.jpa.open-in-view=false

# ── flyway ────────────────────────────────────────────────────────────────
# On startup Flyway looks in classpath:db/migration for V<n>__*.sql files,
# checks flyway_schema_history to see which already ran, and applies the rest
# in order. First run against this empty DB => it applies V1.
spring.flyway.enabled=true

# ── auth ──────────────────────────────────────────────────────────────────
# HMAC key for signing access tokens. No default, exactly like the database
# password: a token signed with a key that leaked into a public repository is not
# a token at all. Must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET}

# Short on purpose. The client re-authenticates with its device secret when a token
# expires, so a leaked token is only useful for this long.
app.jwt.ttl=PT1H

# ── backoffice ────────────────────────────────────────────────────────────
# The first administrator, created at startup and only while the admin_user table is empty.
# See admin/AdminBootstrap for why it happens there and not as a seed row in a migration —
# briefly: a committed migration would publish the hash, and a public BCrypt hash is a
# password everybody has.
#
# Empty defaults, unlike DB_PASSWORD and JWT_SECRET above. Those have none because a
# deployment missing them is broken; these have one because a deployment that already has an
# administrator has no use for them, and refusing to start would be a strange way to say
# "everything is already fine".
#
#   locally  — set both in application-local.properties (git-ignored)
#   deployed — ADMIN_USERNAME / ADMIN_PASSWORD from the environment, out of the Key Vault
app.admin.bootstrap.username=${ADMIN_USERNAME:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}

# ── rate limiting ─────────────────────────────────────────────────────────
# Guards POST /v1/auth/token, which spends ~100ms of CPU on BCrypt per call whether the
# secret is right or wrong. Without a ceiling that is a denial-of-service lever anyone
# can pull without an account. See web/RateLimitConfig.
#
# Thirty per minute per address, burstable to thirty. The number is a balance between two
# ways of being wrong, and both matter:
#
#   Too high and the limit stops mattering. At 30/min one address can buy 3 seconds of
#   BCrypt per minute — about 5% of a single core. An unlimited socket can saturate every
#   core in the machine, so this is still a reduction of two orders of magnitude.
#
#   Too low and real players are refused. Mobile carriers put thousands of subscribers
#   behind one public address (CGNAT), so a per-address limit is shared by strangers. A
#   token lasts an hour, so each device needs roughly one per hour: 30/min carries about
#   1800 devices behind a single address before anyone notices.
#
# It is worth being honest that per-address limiting is blunt for exactly that reason. It
# defends against one machine, not against a botnet, and it is the ceiling of what can be
# done before there is a real account to limit instead.
app.ratelimit.enabled=true
app.ratelimit.capacity=30
app.ratelimit.window=1m

# How many distinct callers are tracked at once. The limiter has to forget people, or it
# becomes the memory-exhaustion version of the problem it solves.
app.ratelimit.max-clients=100000

# ── server ────────────────────────────────────────────────────────────────
server.port=8080

# ── actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
