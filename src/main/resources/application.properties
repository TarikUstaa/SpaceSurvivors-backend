spring.application.name=spacesurvivors

# ── database ──────────────────────────────────────────────────────────────
# Local Postgres. Spring opens a small connection pool (HikariCP) to this URL
# on startup and hands it to JdbcClient / Flyway.
spring.datasource.url=jdbc:postgresql://localhost:5432/spacesurvivors
spring.datasource.username=ss_app
spring.datasource.password=ss_app_local_dev

# ── flyway ────────────────────────────────────────────────────────────────
# On startup Flyway looks in classpath:db/migration for V<n>__*.sql files,
# checks flyway_schema_history to see which already ran, and applies the rest
# in order. First run against this empty DB => it applies V1.
spring.flyway.enabled=true

# ── server ────────────────────────────────────────────────────────────────
server.port=8080

# ── actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
