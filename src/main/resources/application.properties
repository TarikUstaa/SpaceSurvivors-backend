spring.application.name=spacesurvivors

# ── profile ───────────────────────────────────────────────────────────────
# Defaults to "local", which pulls in the git-ignored application-local.properties
# holding this machine's database password. Deployments set SPRING_PROFILES_ACTIVE
# and supply DB_* through the environment instead.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ── database ──────────────────────────────────────────────────────────────
# Spring opens a small connection pool (HikariCP) to this URL on startup and hands
# it to JdbcClient / Flyway. No credential is committed: the password has no
# default here, so a missing one fails loudly at startup rather than silently
# falling back to something a repository once knew.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spacesurvivors}
spring.datasource.username=${DB_USER:ss_app}
spring.datasource.password=${DB_PASSWORD}

# ── jpa / hibernate ────────────────────────────────────────────────────────
# validate, not update: Flyway owns the schema. Hibernate only checks that the
# entities match what the migrations built, and refuses to start if they drift —
# a mismatch found at boot beats one found by a user.
spring.jpa.hibernate.ddl-auto=validate

# Off. Open-in-view keeps a database session alive for the whole request so a lazy
# association can still be loaded while the response is being rendered. That hides
# where queries actually happen and holds a connection far longer than needed.
spring.jpa.open-in-view=false

# ── flyway ────────────────────────────────────────────────────────────────
# On startup Flyway looks in classpath:db/migration for V<n>__*.sql files,
# checks flyway_schema_history to see which already ran, and applies the rest
# in order. First run against this empty DB => it applies V1.
spring.flyway.enabled=true

# ── auth ──────────────────────────────────────────────────────────────────
# HMAC key for signing access tokens. No default, exactly like the database
# password: a token signed with a key that leaked into a public repository is not
# a token at all. Must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET}

# Short on purpose. The client re-authenticates with its device secret when a token
# expires, so a leaked token is only useful for this long.
app.jwt.ttl=PT1H

# ── server ────────────────────────────────────────────────────────────────
server.port=8080

# ── actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
