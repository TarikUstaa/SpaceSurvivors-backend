<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password · SpaceSurvivors backoffice</title>
    <link rel="stylesheet" th:href="@{/admin/assets/admin.css}">
</head>
<body>

<header th:replace="~{admin/fragments :: topbar('password', ${admin})}"></header>

<main class="narrow">
    <h1>Change your password</h1>
    <p class="subtitle">
        Signing in again is not required — the session you are using stays valid.
    </p>

    <div th:replace="~{admin/fragments :: flash}"></div>

    <section class="panel">
        <!--
          autocomplete tells a password manager which field is which: without it, managers
          regularly save the *current* password as the new one and lock somebody out of their
          own account.
        -->
        <form th:action="@{/admin/password}" method="post">
            <div class="field">
                <label for="currentPassword">Current password</label>
                <input type="password" id="currentPassword" name="currentPassword"
                       autocomplete="current-password" required autofocus>
            </div>
            <div class="field">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" name="newPassword"
                       autocomplete="new-password" th:attr="minlength=${minLength}" required>
                <span class="hint">At least <span th:text="${minLength}">12</span> characters.</span>
            </div>
            <div class="field">
                <label for="confirmPassword">New password again</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       autocomplete="new-password" required>
            </div>
            <button type="submit" class="primary">Change password</button>
        </form>
    </section>

    <p class="muted small">
        Asking for the current password is not a formality. A session someone else got hold of
        already has everything on this page except that.
    </p>
</main>

</body>
</html>
