# Deployed settings. Active when SPRING_PROFILES_ACTIVE=prod, which the container image
# sets for itself — see the Dockerfile. Everything secret still comes from the environment;
# this file is committed and must stay free of credentials.
#
# Why a profile at all: the base application.properties defaults the active profile to
# "local", which pulls in the git-ignored application-local.properties holding this
# machine's database password. In a container that file does not exist. Spring would boot
# anyway — a missing profile file is not an error — but then "local" would be the name of
# the running deployment, which is a lie that costs someone an afternoon eventually.

# ── behind a proxy ────────────────────────────────────────────────────────
# The container never sees the internet directly: Azure's ingress terminates TLS and
# forwards the request, so every connection arrives from the proxy's address. Left alone,
# request.getRemoteAddr() would return that one address for every player on earth — which
# would collapse the rate limiter into a single shared bucket (thirty tokens for everyone)
# and write the proxy's IP into player_profile.last_ip for every player.
#
# "framework" installs Spring's ForwardedHeaderFilter, which reads the X-Forwarded-* headers
# and rewrites the request itself: getRemoteAddr, getScheme and getServerName all start
# telling the truth. This is the reason RateLimitFilter and ClientAddress read getRemoteAddr
# and deliberately never parse X-Forwarded-For by hand — a header anyone can send is only
# trustworthy once something we control has overwritten it, and that something is the filter
# this line turns on.
#
# It follows that this must NOT be set anywhere the app is reachable without a proxy in
# front, which is exactly why it lives in the prod profile and not in the base file.
server.forward-headers-strategy=framework

# ── logging ───────────────────────────────────────────────────────────────
# Quieter than the default: a deployed service's logs are read after something has already
# gone wrong, and Hibernate's startup chatter buries the line that matters.
logging.level.org.hibernate=warn
logging.level.org.springframework.web=warn

# ── errors ────────────────────────────────────────────────────────────────
# Never return a stack trace or a message to a caller. ApiExceptionHandler already decides
# what each failure is allowed to say; this makes sure Spring's own fallback page cannot
# leak internals when something escapes it.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ── actuator ──────────────────────────────────────────────────────────────
# Nothing to set here. The probe endpoint the platform will poll is GET /health, a plain
# controller of ours (web/HealthController) that answers {"status","db"} and is the only path
# SecurityConfig lets through unauthenticated. Actuator's own /actuator/health is a separate
# endpoint, is not on that allow-list, and so already requires a token in this deployment.
