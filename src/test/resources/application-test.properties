# Settings for the "test" profile, selected by @DatabaseTest.
#
# The point of this file is that it is COMMITTED. Tests used to read
# application-local.properties, which is git-ignored and exists only on one machine, so a
# fresh clone could not start the application context at all. Everything here is a
# throwaway value; nothing in it is a secret, and nothing in it is used outside tests.
#
# NOTE this is application-TEST.properties, not application.properties. A file with the
# latter name under src/test/resources would shadow the real one entirely rather than add
# to it, and the application would lose its JPA, Flyway and Actuator settings. A
# profile-specific file layers on top, which is what we want.

# The main configuration deliberately leaves ${DB_PASSWORD} without a default so a missing
# one fails loudly in production. Tests need the placeholder satisfied for the properties
# to bind at all — the value is never used, because @ServiceConnection takes the real
# credentials straight from the container.
spring.datasource.password=unused-testcontainers-supplies-the-real-one

# Any 32-byte string will do: these tokens are minted and verified inside a single test run
# and are worthless the moment it ends.
app.jwt.secret=test-only-signing-key-not-a-secret-at-all

# Somebody has to be able to sign in to the backoffice for its tests to mean anything.
# Bootstrapping it here rather than inserting the row inside each test is deliberate:
# AdminBootstrap then runs for real on every context start, and if it ever stopped creating
# the account the sign-in tests would fail — where a self-inserted row would keep them green
# while the thing they exist to protect was broken.
app.admin.bootstrap.username=testadmin
app.admin.bootstrap.password=test-admin-password

# Off by default, because the limiter is a cross-cutting guard: left on, it silently caps
# how many times any test may ask for a token, and the next test someone adds to an auth
# class would fail as a 429 that has nothing to do with what they were testing. The one
# test that is about the limiter turns it back on for itself.
app.ratelimit.enabled=false
